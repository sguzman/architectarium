name: Rendered browser smoke
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/browser-smoke.mjs'
      - 'scripts/build-site.mjs'
      - 'gallery/**'
      - 'ontology/**'
      - '.github/workflows/browser-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test browser
        run: |
          npm install --no-save playwright@1.64.1
          npx playwright install --with-deps chromium
      - name: Assemble site
        run: |
          node scripts/build-site.mjs
      - name: Exercise desktop and mobile gallery
        run: |
          python3 -m http.server 4173 --directory _site >/tmp/architectarium-test-server.log 2>&1 &
          node scripts/browser-smoke.mjs
      - name: Upload visual QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: architectarium-browser-captures
          path: qa-shots/
          if-no-files-found: ignore
          retention-days: 7
